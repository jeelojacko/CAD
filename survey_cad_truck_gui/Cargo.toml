[package]
name = "survey_cad_truck_gui"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
slint = { version = "1.12.1", features = ["unstable-wgpu-24"] }
i-slint-common = { version = "1.12.1" }
survey_cad = { path = "../survey_cad" }
rfd = "0.15"
tiny-skia = "0.11"
truck_cad_engine = { path = "../truck_cad_engine" }
truck-modeling = { path = "../truck-master/truck-modeling" }
truck-meshalgo = { path = "../truck-master/truck-meshalgo", features = ["tessellation"] }
truck-rendimpl = { path = "../truck-master/truck-rendimpl" }
once_cell = "1"
rusttype = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
shell-words = "1.1"
dirs = "6"
pipe_network = { path = "../pipe_network" }
pyo3 = { version = "0.21", features = ["auto-initialize", "abi3-py311"], optional = true }
survey_cad_python = { path = "../survey_cad_python", default-features = false, optional = true }
open = "5"
rstar = "0.9"
thiserror = "1"
log = "0.4"

[build-dependencies]
slint-build = "1"
pyo3-build-config = "0.21"

[features]
default = []
python = ["pyo3", "survey_cad_python"]
shapefile = ["survey_cad/shapefile"]
las = ["survey_cad/las"]
kml = ["survey_cad/kml"]
fgdb = ["survey_cad/fgdb"]
e57 = ["survey_cad/e57"]
gui-tests = []

[dev-dependencies]
tempfile = "3"
